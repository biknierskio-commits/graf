name: Discord Event Scheduler with Reminder & Delete

on:
  schedule:
    - cron: "* * * * *"  # checks every minute
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders and auto-delete
        shell: bash
        run: |
          NOW=$(date +%s)
          DAY=$(date +%u)  # 1=Mon ... 7=Sun
          
          send() {
            RESPONSE=$(curl -s -H "Content-Type: application/json" \
              -X POST -d "$1" ${{ secrets.DISCORD_WEBHOOK }})
            MESSAGE_ID=$(echo "$RESPONSE" | grep -oP '(?<="id":")[^"]+')
            echo "$MESSAGE_ID"
          }

          schedule_event() {
            EVENT_TS=$1
            REMINDER_TS=$2
            EVENT_JSON="$3"
            REMINDER_JSON="$4"
            DAYS="$5"

            # Only run on allowed days
            if ! echo " $DAYS " | grep -qw "$DAY"; then
              return
            fi

            # Reminder 5 min before
            if [ $NOW -ge $REMINDER_TS ] && [ $NOW -lt $(( REMINDER_TS + 60 )) ]; then
              send "$REMINDER_JSON"
            fi

            # Main event
            if [ $NOW -ge $EVENT_TS ] && [ $NOW -lt $(( EVENT_TS + 60 )) ]; then
              MESSAGE_ID=$(curl -s -H "Content-Type: application/json" \
                -X POST -d "$EVENT_JSON" ${{ secrets.DISCORD_WEBHOOK }} | grep -oP '(?<="id":")[^"]+')
              if [ ! -z "$MESSAGE_ID" ]; then
                echo "Will delete $MESSAGE_ID in 30 minutes"
                sleep 1800
                curl -s -X DELETE -H "Content-Type: application/json" \
                  ${{ secrets.DISCORD_WEBHOOK }}/messages/$MESSAGE_ID
              fi
            fi
          }

          # ===================== TEST EVENT =====================
          TEST_EVENT_TS=$(( NOW + 420 ))          # 7 minutes from now
          TEST_REMINDER_TS=$(( TEST_EVENT_TS - 300 ))  # 5 minutes before

          schedule_event $TEST_EVENT_TS $TEST_REMINDER_TS \
            '{"content":"<@&1453137439550865481> **[TEST] Beast Invasion starts now!**"}' \
            '{"content":"<@&1453137439550865481> **[TEST] Reminder: Beast Invasion in 5 minutes!**"}' \
            "1 2 3 4 5 6 7"

          # ===================== REAL EVENTS =====================
          # Beast Invasions (Daily)
          schedule_event 1767027632 1767027332 \
            '{"content":"<@&1453137439550865481> **Beast Invasions starts now!** <t:1767027632:t>"}' \
            '{"content":"<@&1453137439550865481> **Reminder: Beast Invasions in 5 minutes!** <t:1767027632:t>"}' "1 2 3 4 5 6 7"

          schedule_event 1766962832 1766962532 \
            '{"content":"<@&1453137439550865481> **Beast Invasions starts now!** <t:1766962832:t>"}' \
            '{"content":"<@&1453137439550865481> **Reminder: Beast Invasions in 5 minutes!** <t:1766962832:t>"}' "1 2 3 4 5 6 7"

          # Sect Clash (Saturday)
          schedule_event 1766952032 1766951732 \
            '{"content":"<@&1453137439550865481> **Sect Clash starts now!** <t:1766952032:t>-<t:1766952900:t>"}' \
            '{"content":"<@&1453137439550865481> **Reminder: Sect Clash in 5 minutes!** <t:1766952032:t>"}' "6"

          # Otherworld Invasion (Sat & Sun)
          schedule_event 1767020400 1767020100 \
            '{"content":"<@&1453137439550865481> **Otherworld Invasion starts now!** <t:1767020400:t> - <t:1766977200:t>"}' \
            '{"content":"<@&1453137439550865481> **Reminder: Otherworld Invasion in 5 minutes!** <t:1767020400:t>"}' "6 7"

          # Demonbend Abyss & Sect Meditation (Mon–Fri)
          schedule_event 1767025800 1767025500 \
            '{"content":"<@&1453137439550865481> **Demonbend Abyss & Sect Meditation starts now!** <t:1767025800:t>"}' \
            '{"content":"<@&1453137439550865481> **Reminder: Demonbend Abyss & Sect Meditation in 5 minutes!** <t:1767025800:t>"}' "1 2 3 4 5"

          # World Apex (Sunday)
          schedule_event 1766952000 1766951700 \
            '{"content":"<@&1453137439550865481> **World Apex starts now!** <t:1766952000:t>"}' \
            '{"content":"<@&1453137439550865481> **Reminder: World Apex in 5 minutes!** <t:1766952000:t>"}' "7"
